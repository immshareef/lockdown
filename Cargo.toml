[package]
name = "lockdown"
version = "0.2.0"
edition = "2021"

[dependencies]
eframe = "0.27"
pqcrypto-kyber = "0.8"
pqcrypto-traits = "0.3"
aes-gcm = "0.10"
argon2 = "0.5"
hkdf = "0.12"
sha2 = "0.10"
zeroize = "1.7"
walkdir = "2.4"
thiserror = "1.0"
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[lib]
name = "lockdown"
path = "src/lib.rs"

[[bin]]
name = "lockdown"
path = "src/main.rs"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
